<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="DDash: your whole business, one dashboard">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0a"/><stop offset="1" stop-color="#121a05"/></linearGradient>
<radialGradient id="glow" cx="0.78" cy="0.5" r="0.5"><stop offset="0" stop-color="#c4f13a" stop-opacity="0.22"/><stop offset="1" stop-color="#c4f13a" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<style>
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.line{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 1.8s .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dot{opacity:0;animation:pop .4s 2.2s forwards}
@keyframes pop{to{opacity:1}}
.pulse{animation:pulse 2.4s 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
</style></defs>
<rect width="1280" height="420" rx="28" fill="url(#bg)"/><rect width="1280" height="420" rx="28" fill="url(#grid)"/><rect width="1280" height="420" rx="28" fill="url(#glow)"/>
<rect x="80" y="70" width="56" height="56" rx="14" fill="#1a1a1a" stroke="#2a2a2a"/>
<path d="M94 84h9.5a14 14 0 0 1 0 28H94V84Z" fill="#fafafa"/><path d="M118 84h4.6a14 14 0 0 1 0 28H118" fill="none" stroke="#c4f13a" stroke-width="6" stroke-linecap="round"/>
<text x="152" y="110" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#fafafa">DDash</text>
<text x="80" y="215" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="#fafafa" letter-spacing="-2.5">Your whole business,</text>
<text x="80" y="290" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="#c4f13a" letter-spacing="-2.5">one dashboard.</text>
<text x="82" y="345" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" fill="#a3a3a3">Live charts · Automatic reports · Employee logins · Custom tabs</text>
<text x="82" y="378" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#737373">Multi-tenant SaaS built with Next.js, Supabase and Glisse  ·  by DevDynamo</text>
<line x1="860" y1="340" x2="1200" y2="340" stroke="#2a2a2a" stroke-width="3"/>
<rect class="bar" style="animation-delay:0.00s" x="870" y="270" width="46" height="70" rx="9" fill="#2a2a2a"/>
<rect class="bar" style="animation-delay:0.12s" x="940" y="225" width="46" height="115" rx="9" fill="#2a2a2a"/>
<rect class="bar" style="animation-delay:0.24s" x="1010" y="240" width="46" height="100" rx="9" fill="#2a2a2a"/>
<rect class="bar" style="animation-delay:0.36s" x="1080" y="180" width="46" height="160" rx="9" fill="#2a2a2a"/>
<rect class="bar" style="animation-delay:0.48s" x="1150" y="125" width="46" height="215" rx="9" fill="#c4f13a"/>
<polyline class="line" points="893,262 963,215 1033,235 1103,170 1173,108" fill="none" stroke="#fafafa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="dot" cx="1173" cy="108" r="10" fill="#fafafa"/><circle class="dot pulse" cx="1173" cy="108" r="20" fill="none" stroke="#c4f13a" stroke-width="3"/>
</svg>